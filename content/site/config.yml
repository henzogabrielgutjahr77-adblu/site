quem_somos:
  titulo: Quem Somos
  subtitulo: Conheça nossa história, missão e propósito.
  imagem: /uploads/quem-somos.jpg
  historia_titulo: Nossa História
  historia_texto: |
    A **Assembleia de Deus Blumenau Missões** é uma congregação da Assembleia de Deus,
    nascida com o coração voltado para a evangelização.

    Nosso lema é simples e forte: **"Evangelização, a chama não pode apagar!"**

    - **Evangelismo** — levar o amor de Deus às ruas, casas e corações;
    - **Discipulado** — ajudar cada pessoa a crescer na fé;
    - **Comunhão** — viver em família, com acolhimento e cuidado;
    - **Missões** — apoiar a obra missionária dentro e fora do país.
  missao_titulo: Nossa Missão
  missao_texto: |
    Evangelizar, discipular e cuidar de pessoas, levando a esperança de Cristo às ruas,
    casas e corações — a chama não pode apagar!
  visao_titulo: Nossa Visão
  visao_texto: |
    Ser uma congregação pequena e acolhedora, que reflete o amor de Deus e cresce em
    comunhão, alcançando a cidade de Blumenau.
  valores_titulo: Nossos Valores
  valores:
    - Palavra de Deus
    - Oração
    - Comunhão
    - Evangelização
    - Serviço
